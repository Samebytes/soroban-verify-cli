[package]
name = "soroban-verify-cli"
version = "0.1.0"
edition = "2021"
description = "Rebuild a Soroban contract from a public commit and compare its WASM hash to the on-chain hash"
license = "Apache-2.0"

[lib]
name = "soroban_verify"
path = "src/lib.rs"

[[bin]]
name = "soroban-verify"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
tempfile = "3"
